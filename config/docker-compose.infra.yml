version: '3.8'

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: epistemic-searxng
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-data:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    restart: unless-stopped

  firecrawl:
    image: mendableai/firecrawl:latest
    container_name: epistemic-firecrawl
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NUM_WORKERS=4
    restart: unless-stopped
