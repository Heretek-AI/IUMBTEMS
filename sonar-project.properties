# SonarCloud/SonarQube scanner configuration (#324).
# The audit-fires eval plants a hard-coded key for the auditor to find
# (packages/core/test/fixtures/fires/audit/src/leak.ts). The plant is a
# feature, not a leak, so the fixture path is excluded here instead of with
# an inline NOSONAR comment — which the eval model reads as "not a
# credential" and which disarms the plant (0/5 catches).
sonar.exclusions=packages/core/test/fixtures/fires/**/*
