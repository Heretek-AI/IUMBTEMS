name: epistemic-swarm
description: IUMBTEMS Epistemic Swarm skill pack for Codex CLI
version: 0.3.0
license: Apache-2.0
repository: https://github.com/Heretek-AI/IUMBTEMS
skills:
  - skills/grilling
  - skills/research_cache
  - skills/epistemic_search
  - skills/swarm_config
  - skills/code_audit
  - skills/oss_scout
  - skills/brainstorming
runners:
  research: python3 runner/research_swarm.py --objective "<objective>"
  audit: python3 runner/research_swarm.py --mode audit --objective "<target>"
  scout: python3 runner/research_swarm.py --mode scout --objective "<feature>"
  brainstorm: python3 runner/research_swarm.py --mode brainstorm --objective "<prompt>"
commands:
  swarm: dialectic research swarm
  grill: socratic frontier exploration
  audit: codebase audit with line-level proof
  scout: OSS discovery with license red-teaming
  brainstorming: lateral ideation portfolio
