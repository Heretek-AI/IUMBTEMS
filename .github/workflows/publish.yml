name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: IUMBTEMS
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm (required for OIDC trusted publishing)
        # Node's bundled npm predates OIDC Trusted Publishing. Without a modern
        # npm the publish still *signs provenance* (that is an older feature)
        # but the registry then rejects the package PUT with a bare
        #   npm error 404 Not Found - PUT https://registry.npmjs.org/@heretek-ai%2fepistemic-swarm
        # because setup-node's .npmrc supplies an empty NODE_AUTH_TOKEN
        # placeholder instead of the OIDC-derived credential.
        #
        # 41d5f6f removed the old `npm install -g npm@latest` step as "CI npm
        # script protection" and broke publishing. That was the third
        # hardening change in that commit to drop a load-bearing dependency
        # (the others: a claude-code pin too old for `plugin validate --strict`,
        # and `--ignore-scripts` blocking claude-code's native-binary
        # postinstall). Pin an exact npm version so the supply-chain intent
        # survives without floating.
        run: npm install -g --ignore-scripts npm@12.1.0

      - name: Run Test Suite
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          python3 -m unittest discover -s runner/tests

      - name: Publish Package to npm (Trusted Publishing OIDC)
        run: npm publish --provenance --access public
