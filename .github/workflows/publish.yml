name: Publish

# Human step, after the 1.0 merge. Publishes with npm trusted publishing
# (OIDC) and provenance; no long-lived token is stored. Configure each package
# as a trusted publisher for this workflow before the first run. Defaults to a
# dry run.
#
# Publish hardening (#328): a non-dry-run publish is guarded (the three
# release manifests must agree with each other and with the top CHANGELOG
# entry, and tag v<version> must not exist yet), and a successful publish
# tags the published commit (annotated v<version>) and creates the GitHub
# release from the CHANGELOG entry — no manual step. The second gate stays
# human: the IUMBTEMS environment requires a reviewer's approval and runs
# only on main (set in GitHub settings, never by an agent).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run (no upload)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Must match the Environment name on the npm trusted publisher entry
    # (package Settings → Trusted Publisher). OIDC validation fails without it.
    environment: IUMBTEMS
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The agent sandbox (1.1.1): factory seats and gate runs require
      # bubblewrap; Ubuntu 24.04 also restricts unprivileged user namespaces.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev -- true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      # Publish guard (#328): a non-dry-run publish needs one agreed version
      # across the release manifests and the top CHANGELOG entry, and a free
      # tag — otherwise a second publish of the same version stops here,
      # before `npm publish`. Needs only checkout and bun (no install):
      # it runs first so a skewed tree fails fast. Dry runs skip every check.
      - name: "Publish guard: version parity and free tag"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN:-true}" = "true" ]; then
            echo "publish guard: dry run, skipping version and tag checks"
            exit 0
          fi
          versions="$(bun scripts/packages.ts --release | while read -r pkg _slug; do
            grep -m1 '"version"' "packages/$pkg/package.json" | sed 's/.*"version": *"//;s/".*//'
          done | sort -u)"
          if [ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]; then
            echo "publish guard: refusing: release manifests disagree:" >&2
            printf '%s\n' "$versions" >&2
            exit 1
          fi
          top="$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -n 1)"
          if [ "$top" != "$versions" ]; then
            echo "publish guard: refusing: top CHANGELOG entry ($top) disagrees with manifests ($versions)" >&2
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$versions" >/dev/null 2>&1; then
            echo "publish guard: refusing: tag v$versions already exists; a second publish of the same version stops here" >&2
            exit 1
          fi
          echo "publish guard: version $versions agreed, tag v$versions free"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run docs:check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Build and pack the way users install (`bun pm pack` rewrites
      # workspace:* to real versions), smoke-test the installed tarballs, and
      # publish exactly those tarballs.
      - run: scripts/pack-smoke.sh packs
      # The release tarballs, in publish order, from the single source of
      # truth (scripts/packages.ts); pack-smoke.sh packed exactly these.
      - id: packages
        run: echo "tarballs=$(bun scripts/packages.ts --release | awk '{print "./packs/"$2"-*.tgz"}' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # Trusted publishing needs a recent npm CLI; it picks up the OIDC token
      # from the environment automatically (no NODE_AUTH_TOKEN). Pinned, and no
      # lifecycle scripts from the fetched tarball run.
      - run: npm install --global --ignore-scripts npm@11.21.0
      - name: Publish packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Publish order comes from scripts/packages.ts (core, then the CLI
          # and the OpenCode plugin): the glob expands each step's tarball.
          # NOTE: the ./ prefix is load-bearing. A bare packs/foo.tgz is
          # parsed as a GitHub user/repo shorthand (git ls-remote failure);
          # ./packs/foo.tgz is resolved as the local tarball.
          # Fail closed: an empty tarball list (e.g. --release format drift
          # through the awk above) must never exit 0 having published nothing.
          if [ -z "${{ steps.packages.outputs.tarballs }}" ]; then
            echo "publish: no tarballs listed by scripts/packages.ts --release" >&2
            exit 1
          fi
          for tgz in ${{ steps.packages.outputs.tarballs }}; do
            echo "::group::npm publish $tgz"
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$tgz" --provenance --access public --dry-run
            else
              npm publish "$tgz" --provenance --access public
            fi
            echo "::endgroup::"
          done

  # Tag and release (#328): after a successful non-dry-run publish, the
  # published commit gets the annotated tag v<version> and the GitHub release
  # with the CHANGELOG entry as notes — no manual step. `contents: write`
  # lives on this job only; everything above stays read-only. The `git push`
  # fails if the tag appeared since the guard ran, so a double publish still
  # stops here.
  tag-and-release:
    needs: [publish]
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(bun scripts/packages.ts --release | while read -r pkg _slug; do
            grep -m1 '"version"' "packages/$pkg/package.json" | sed 's/.*"version": *"//;s/".*//'
          done | sort -u)"
          if [ "$(printf '%s\n' "$version" | wc -l)" -ne 1 ]; then
            echo "tag-and-release: refusing: release manifests disagree" >&2
            printf '%s\n' "$version" >&2
            exit 1
          fi
          notes="$(awk '/^## /{count++; if (count == 2) exit; next} count == 1' CHANGELOG.md)"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            tag -a "v$version" -m "Release v$version" "${GITHUB_SHA:?}"
          git push origin "v$version"
          gh release create "v$version" --target "${GITHUB_SHA:?}" --title "Release v$version" --notes "$notes"
