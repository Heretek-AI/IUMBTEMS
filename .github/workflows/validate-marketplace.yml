name: Validate Claude Code Marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Claude Code CLI
        # Pinned for S6505/S8543 (supply-chain: no floating tag, no implicit
        # lifecycle scripts from the dependency tree).
        #
        # Two constraints fight here:
        #   * the pin must be >= the version that ships `plugin validate --strict`
        #     (0.2.29 predates the flag and died with `unknown option '--strict'`)
        #   * claude-code 2.x links its platform-native binary in postinstall, so
        #     `--ignore-scripts` alone leaves `claude native binary not installed`.
        #
        # Resolution: install with scripts suppressed, then run the vendor's own
        # postinstall explicitly. That way exactly one audited script runs rather
        # than every lifecycle hook in the tree. The path is stable because the
        # version is pinned.
        run: |
          npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.274
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version

      - name: Validate Claude Code Marketplace & Plugins
        run: |
          echo "Validating marketplace manifest..."
          claude plugin validate --strict .claude-plugin/marketplace.json
          echo "Validating root epistemic-swarm plugin manifest..."
          claude plugin validate --strict .claude-plugin/plugin.json
          echo "Validating modular socratic-grilling plugin manifest..."
          claude plugin validate --strict plugins/socratic-grilling/.claude-plugin/plugin.json
          echo "Validating modular research-cache plugin manifest..."
          claude plugin validate --strict plugins/research-cache/.claude-plugin/plugin.json
          echo "Validating workspace..."
          claude plugin validate --strict .
