name: Plugin Evals

# Behavioral scoring for Claude Code plugins. Every run spends real model
# calls against the account bill — never run the full suite per-push.
on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Case pass threshold (0-1)"
        default: "0.8"
      max_cost_usd:
        description: "Cost ceiling (list-price estimate)"
        default: "20"
  release:
    types: [published]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: |
          npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.274
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version

      - name: Validate manifests first (fail fast, free)
        run: |
          claude plugin validate --strict .claude-plugin/marketplace.json
          claude plugin validate --strict .claude-plugin/plugin.json
          claude plugin validate --strict plugins/darkharvest/.claude-plugin/plugin.json
          claude plugin validate --strict plugins/factory/.claude-plugin/plugin.json
          claude plugin validate --strict .

      - name: Eval flagship suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval . \
            --trust-plugin \
            --json evals-results.json \
            --threshold ${{ inputs.threshold || '0.8' }} \
            --model claude-sonnet-4-5 \
            --judge-model claude-haiku-4-5 \
            --no-publish \
            --max-cost-usd ${{ inputs.max_cost_usd || '20' }}

      - name: Eval darkharvest modular
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval ./plugins/darkharvest \
            --trust-plugin \
            --json evals-darkharvest.json \
            --threshold ${{ inputs.threshold || '0.8' }} \
            --model claude-sonnet-4-5 \
            --judge-model claude-haiku-4-5 \
            --no-publish \
            --max-cost-usd ${{ inputs.max_cost_usd || '20' }}

      - name: Eval factory modular
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude plugin eval ./plugins/factory \
            --trust-plugin \
            --json evals-factory.json \
            --threshold ${{ inputs.threshold || '0.8' }} \
            --model claude-sonnet-4-5 \
            --judge-model claude-haiku-4-5 \
            --no-publish \
            --max-cost-usd ${{ inputs.max_cost_usd || '20' }}

      - name: Archive results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-eval-results
          path: evals-*.json
