name: CI

on:
  push:
    branches: [rewrite, main]
  pull_request:

# Least privilege: the workflow only reads the checkout.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to commit SHAs (bump deliberately).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The agent sandbox (1.1.1): factory seats and gate runs require
      # bubblewrap; Ubuntu 24.04 also restricts unprivileged user namespaces.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev -- true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run docs:check

  # The packages as users install them: build, `bun pm pack` (rewrites
  # workspace:*), npm install, then run the CLI under Node 22 (the minimum
  # engine) and import the OpenCode plugin under Bun.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: scripts/pack-smoke.sh
