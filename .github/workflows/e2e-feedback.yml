name: E2E feedback (opencode + plugin)

# Repeatable end-to-end test: install opencode, install the plugin the way
# users get it, exercise the seats against a real model, then leave a
# deterministic debug report plus one best-effort agent feedback note.
#
# - `scripts/pack-smoke.sh` proves the packed tarballs install and load.
# - `bun run evals` runs one real, step-capped turn per `evals/cases/*.json`
#   in an isolated workspace loading this repo's plugin; a failed case keeps
#   its workspace, event stream and stderr under evals/results/<stamp>/.
# - `bun scripts/e2e-report.ts` renders the deterministic report, and
#   evals/results/ is uploaded as the `e2e-feedback` artifact.
# - `bun scripts/e2e-gate.ts` decides the verdict (#68, option 1): the job
#   fails only when a historically stable case (90%+ over 5+ sampled runs)
#   fails now, so a red job means a regression, not model noise. The evals
#   step itself is `continue-on-error`; this gate owns the outcome.
# - The `agent-feedback` step asks the model to diagnose that report (one
#   `timeout`-bounded turn; best-effort, never masks the eval verdict).
#
# Secrets/vars (same triple as the nightly evals job):
#   secrets.ES_EVAL_API_KEY  the provider key
#   vars.ES_EVAL_MODEL       e.g. opencode/muse-spark-1.3-contributor-free
#   vars.ES_EVAL_KEY_VAR     env-var name for the key (default ANTHROPIC_API_KEY;
#                            use OPENCODE_API_KEY for Zen/Go keys)
on:
  push:
    branches: [rewrite]
  workflow_dispatch:
    inputs:
      model:
        description: "Override vars.ES_EVAL_MODEL for this run (empty = use the variable)"
        required: false
        default: ""
      max_steps:
        description: "Step ceiling: each case runs under its own maxSteps, never above this"
        required: false
        default: "24"
      max_usd:
        description: "Spend budget for the whole run in USD, from step_finish cost (empty = none)"
        required: false
        default: ""

# Least privilege: the workflow reads the checkout and its own past runs
# (the regression gate samples recent `e2e-feedback` artifacts).
permissions:
  contents: read
  actions: read

jobs:
  e2e-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ES_EVAL_MODEL: ${{ inputs.model || vars.ES_EVAL_MODEL }}
      ES_EVAL_KEY_VAR: ${{ vars.ES_EVAL_KEY_VAR || 'ANTHROPIC_API_KEY' }}
      ES_EVAL_MAX_STEPS: ${{ inputs.max_steps || '24' }}
      ES_EVAL_MAX_USD: ${{ inputs.max_usd }}
      ES_EVAL_TIMEOUT_MS: "300000"
    steps:
      # Third-party actions are pinned to commit SHAs (bump deliberately).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The agent sandbox (1.1.1): factory seats and gate runs require
      # bubblewrap; Ubuntu 24.04 also restricts unprivileged user namespaces.
      - name: Install bubblewrap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev -- true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile --ignore-scripts

      # The packages as users install them (fails on workspace:* leaks or
      # missing bundled assets).
      - name: Install-as-user smoke test
        run: scripts/pack-smoke.sh

      - name: Install opencode CLI
        run: |
          # Pinned to the same CLI the repo tests against; bump deliberately
          # together with @opencode/sdk and @opencode/plugin in package.json.
          npm install --global --ignore-scripts @opencode/cli-linux-x64@2.0.24
          export PATH="$(npm root --global)/@opencode/cli-linux-x64/bin:$PATH"
          opencode --version

      - name: Exercise seats against the real model
        id: evals
        # The regression gate below owns the verdict (#68); a failing eval
        # run must not mask the report, feedback, upload or gate steps.
        continue-on-error: true
        env:
          ES_EVAL_API_KEY: ${{ secrets.ES_EVAL_API_KEY }}
        run: |
          if [ -z "$ES_EVAL_API_KEY" ] || [ -z "$ES_EVAL_MODEL" ]; then
            echo "e2e-feedback: secrets.ES_EVAL_API_KEY and vars.ES_EVAL_MODEL (or inputs.model) are not both set; skipping."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          export PATH="$(npm root --global)/@opencode/cli-linux-x64/bin:$PATH"
          export "$ES_EVAL_KEY_VAR=$ES_EVAL_API_KEY"
          opencode --version
          bun run evals

      # Deterministic report: offline, secret-free, runs even when evals fail.
      - name: Render debug report
        if: always() && steps.evals.outputs.skipped != 'true'
        run: |
          export PATH="$(npm root --global)/@opencode/cli-linux-x64/bin:$PATH"
          newest="$(ls -t evals/results/*.json 2>/dev/null | head -1)"
          [ -n "$newest" ] || { echo "debug report: no flat evals/results/*.json (evals never wrote one); skipping."; exit 0; }
          bun scripts/e2e-report.ts "$newest" "$(opencode --version 2>/dev/null || echo unknown)" "${GITHUB_SHA:0:7}"
          {
            echo "## E2E feedback (${ES_EVAL_MODEL})"
            echo
            cat "${newest%.json}.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # Regression gate (#68): fails the job only when a historically
      # stable case fails now. Runs even when evals fail; skipped cleanly
      # when evals never ran (missing secrets).
      - name: Gate on regressions only
        if: always() && steps.evals.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          newest="$(ls -t evals/results/*.json 2>/dev/null | head -1)"
          [ -n "$newest" ] || { echo "regression gate: no evals/results/*.json (evals never wrote one); skipping."; exit 0; }
          bun scripts/e2e-gate.ts "$newest"

      # One best-effort agent turn over the deterministic report, bounded by
      # `timeout`. Never fails the job: the eval verdict above is what
      # reports.
      - name: Agent feedback on the report
        if: always() && steps.evals.outputs.skipped != 'true'
        continue-on-error: true
        env:
          ES_EVAL_API_KEY: ${{ secrets.ES_EVAL_API_KEY }}
        run: |
          export PATH="$(npm root --global)/@opencode/cli-linux-x64/bin:$PATH"
          export "$ES_EVAL_KEY_VAR=$ES_EVAL_API_KEY"
          newest="$(ls -t evals/results/*.json 2>/dev/null | head -1)"
          report="${newest%.json}.md"
          [ -n "$newest" ] && [ -f "$report" ] || { echo "agent-feedback: no report found; skipping."; exit 0; }
          work="$(mktemp -d)"
          home="$work/home"
          mkdir -p "$home"
          cat > "$work/opencode.json" <<EOF
          {
            "model": "$ES_EVAL_MODEL",
            "plugins": [{ "package": "$GITHUB_WORKSPACE/packages/opencode", "options": { "pr": "off" } }]
          }
          EOF
          prompt="You are a debug analyst. Read the E2E feedback report below and reply with: (1) the most likely root cause per FAIL case, citing the failing check or tool line; (2) the smallest repo change that would fix or further isolate it; (3) anything in the report that looks like harness flakiness rather than a product bug. Keep it under 30 lines. Report: $(head -c 4000 "$report")"
          # opencode resolves its project from PWD (not the spawn cwd), so run
          # inside $work with PWD, HOME and XDG pointed there; otherwise the
          # repo is the project and the host's default model answers.
          (cd "$work" && PWD="$work" HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" \
            XDG_STATE_HOME="$home/.local/state" XDG_CACHE_HOME="$home/.cache" \
            timeout 150 opencode run --standalone --agent build "$prompt") > "$work/feedback.txt" 2>"$work/feedback.err" \
            || { echo "agent-feedback: model turn failed; last of stderr:"; tail -c 800 "$work/feedback.err"; echo; echo "keeping the deterministic report only."; exit 0; }
          cp "$work/feedback.txt" "${newest%.json}.agent-feedback.md"
          { echo "## Agent feedback"; echo; cat "$work/feedback.txt"; } >> "$GITHUB_STEP_SUMMARY"
          echo "agent-feedback: wrote $(basename "${newest%.json}.agent-feedback.md")"

      # The results JSON, the report and every failed case's kept workspace.
      - name: Upload eval evidence
        if: always() && steps.evals.outputs.skipped != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-feedback
          path: evals/results/
          if-no-files-found: ignore
          retention-days: 14
