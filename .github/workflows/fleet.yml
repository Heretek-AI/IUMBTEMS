name: Fleet

# Path-filtered job for packages/fleet (ADR 0001): fleet changes get fast
# feedback here, while the `check` job in CI stays unfiltered and keeps
# running on every push and PR (#122).

on:
  push:
    branches: [rewrite, main, "integration/**", "ticket-*"]
    paths:
      - "packages/fleet/**"
      - ".github/workflows/fleet.yml"
  pull_request:
    paths:
      - "packages/fleet/**"
      - ".github/workflows/fleet.yml"

permissions:
  contents: read

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx biome check packages/fleet
      - run: bun run typecheck
      - run: bun test packages/fleet
